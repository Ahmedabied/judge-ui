name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The contract test runs judge-ui and relevance-gate on each other's files.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'relevance-gate @ git+https://github.com/Ahmedabied/relevance-gate@v0.2.0'
      - run: npm test
        env:
          NEED_RELEVANCE_GATE: "1"
      - run: npm run build
      - run: npm run size
